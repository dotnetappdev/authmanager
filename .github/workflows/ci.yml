name: CI

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore
      run: dotnet restore AuthManager.sln

    - name: Build
      run: dotnet build AuthManager.sln --no-restore -c Release

    - name: Test
      run: dotnet test tests/AuthManager.Tests/AuthManager.Tests.csproj --no-build -c Release

    - name: Generate Allure report
      if: always()
      run: |
        npm install -g allure-commandline --silent
        allure generate tests/AuthManager.Tests/bin/Release/net10.0/allure-results --clean -o allure-report

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Pack (Release only)
      if: github.ref == 'refs/heads/main'
      run: dotnet pack AuthManager.sln --no-build -c Release -o ./nupkgs

    - name: Upload NuGet artifacts
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg

  pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Allure report artifact
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: ./docs/site/allure-report

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/site
        destination_dir: .
